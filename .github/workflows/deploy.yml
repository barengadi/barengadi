name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Test Build
        run: npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Deployment on VPS..."

            # Masuk ke folder web
            mkdir -p /var/www/barengadi
            cd /var/www/barengadi

            # Clone jika belum ada, atau pull update terbaru jika sudah ada
            if [ ! -d ".git" ]; then
              echo "📦 Cloning repository..."
              git clone https://github.com/suryadigit/barengadi.git .
            else
              echo "📥 Pulling latest changes from main..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Install dependencies & compile build Next.js
            echo "🔨 Installing packages & building..."
            npm install
            npm run build

            # Jalankan / Restart dengan PM2
            if pm2 describe barengadi > /dev/null 2>&1; then
              echo "🔄 Reloading PM2 process..."
              pm2 reload barengadi --update-env
            else
              echo "▶️ Starting new PM2 process..."
              pm2 start npm --name "barengadi" -- start
            fi

            pm2 save
            echo "✅ Deployment Successful!"
