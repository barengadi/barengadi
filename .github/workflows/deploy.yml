name: Deploy to VPS (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Docker Deployment on VPS..."
            mkdir -p /var/www/barengadi
            cd /var/www/barengadi
            
            if [ ! -d ".git" ]; then
              git clone https://github.com/barengadi/barengadi.git .
            else
              git remote set-url origin https://github.com/barengadi/barengadi.git 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
            fi

            if command -v docker-compose &> /dev/null; then
              docker-compose up -d --build
            else
              docker compose up -d --build
            fi

            echo "✅ Deployment Successful!"
