name: Deploy to VPS (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker
        run: |
          set -e
          echo "🚀 Starting Docker Deployment..."

          if command -v docker-compose &> /dev/null; then
            docker-compose up -d --build
          else
            docker compose up -d --build
          fi

          echo "✅ Deployment Successful!"
