name: Deploy to VPS (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Docker Deployment on VPS..."

            # Masuk ke folder web
            mkdir -p /var/www/barengadi
            cd /var/www/barengadi

            # Clone jika belum ada, atau pull update terbaru jika sudah ada
            if [ ! -d ".git" ]; then
              echo "📦 Cloning repository..."
              git clone https://github.com/suryadigit/barengadi.git .
            else
              echo "📥 Pulling latest changes from main..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Build & Run Container dengan Docker Compose
            echo "🐳 Building & starting Docker container..."
            docker compose up -d --build

            # Bersihkan image cache lama yang tidak terpakai
            docker image prune -f

            echo "✅ Deployment with Docker Successful!"
