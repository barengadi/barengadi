name: CI/CD — Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: CI — Lint, Type Check, Build Verify
  # ─────────────────────────────────────────────
  ci:
    name: 🔍 CI Check
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build Check
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ─────────────────────────────────────────────
  # JOB 2: Deploy — Docker Compose (only if CI passes)
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: self-hosted
    needs: ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          set -e
          echo "🚀 Starting Docker Deployment..."

          # Build new image
          if command -v docker-compose &> /dev/null; then
            docker-compose build --no-cache
          else
            docker compose build --no-cache
          fi

          # Bring up new container (replace old one)
          if command -v docker-compose &> /dev/null; then
            docker-compose up -d
          else
            docker compose up -d
          fi

          echo "⏳ Waiting for container to be healthy..."
          sleep 10

          # Health check: container harus dalam state running
          CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' barengadi-app 2>/dev/null || echo "not_found")
          if [ "$CONTAINER_STATUS" != "running" ]; then
            echo "❌ Container is not running! Status: $CONTAINER_STATUS"
            docker logs barengadi-app --tail 50
            exit 1
          fi

          echo "✅ Deployment Successful! Container status: $CONTAINER_STATUS"

      - name: Cleanup Old Docker Images
        if: success()
        run: |
          docker image prune -f
          echo "🧹 Old images cleaned up"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED on $(date)"
          echo "Check the logs above for details."
